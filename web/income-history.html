<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>History · Income Tracker</title><style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:linear-gradient(180deg,#f5f4ef,#f7f7fb)}*{box-sizing:border-box}body{margin:0}.shell{max-width:1120px;margin:auto;padding:20px}.workspace-tabs{display:flex;gap:4px;margin-bottom:18px;padding:5px;background:#e8edf2;border-radius:11px;width:max-content;max-width:100%;overflow:auto}.workspace-tabs a{white-space:nowrap;text-decoration:none;color:#536e86;font-size:13px;font-weight:700;padding:9px 13px;border-radius:7px}.workspace-tabs a:hover,.workspace-tabs a:focus{color:#1e5a94;outline:none}.workspace-tabs a[aria-current=page]{background:#fff;color:#1e5a94;box-shadow:0 1px 3px rgba(23,43,64,.16)}.navbar{height:80px;background:#fff;display:flex;justify-content:center;align-items:center}.navbar__container{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:1100px;height:100%;padding:0 18px}.navbar__logo{color:#0e1c67;font-size:2rem;font-weight:700;text-decoration:none}.navbar__menu{display:flex;list-style:none;margin:0;padding:0}.navbar__links{display:flex;align-items:center;height:80px;padding:0 1rem;color:#000;text-decoration:none}.navbar__links:hover,.navbar__links:focus,.navbar__links[aria-current=page]{color:#0e1c67;outline:none}.navbar__links[aria-current=page]{font-weight:700}.main{min-height:100vh;padding:28px 20px 40px}.history-shell{max-width:1100px;margin:auto;display:flex;flex-direction:column;gap:16px}.history-controls{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:18px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.history-controls h1{font-size:1.75rem;margin:0 0 4px}.subtext{margin:0;color:#6b7280;font-size:.95rem}.history-filters input{padding:12px 14px;min-width:260px;border:1px solid #d6d3e5;border-radius:10px;font:inherit}.history-list{display:flex;flex-direction:column;gap:12px}.month-panel{border:1px solid #e7e5f4;border-radius:16px;background:#fff;padding:0 16px 12px;box-shadow:0 14px 32px rgba(17,24,39,.08)}.month-panel summary{list-style:none;cursor:pointer}.month-header{display:flex;justify-content:space-between;align-items:center;padding:12px 0}.month-header h2{font-size:1.15rem;margin:0}.chevron{transition:transform .2s}.month-panel[open] .chevron{transform:rotate(180deg)}.pill-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}.pill{padding:6px 10px;border-radius:999px;font-size:.9rem;font-weight:700}.income-pill{background:#ecfdf3;color:#15803d}.spent-pill{background:#fef2f2;color:#b91c1c}.net-pill{background:#eef2ff;color:#4338ca}.month-layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}.month-entries__grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}.history-entry{border:1px solid #e7e5f4;border-radius:12px;padding:12px;background:#fbfbfe;box-shadow:0 10px 24px rgba(15,23,42,.06)}.history-entry__top{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:6px}.badge{display:inline-flex;padding:6px 10px;border-radius:999px;font-size:.85rem;font-weight:600;background:#ecfdf3;color:#15803d}.badge.spent{background:#fef2f2;color:#b91c1c}.history-amount{font-weight:700}.pos{color:#15803d}.neg{color:#b91c1c}.history-entry p{margin:4px 0 0;color:#374151;font-size:.9rem}.history-date{color:#6b7280!important}.month-budget{position:sticky;top:12px}.history-budget{background:#fff;border:1px solid #e7e5f4;border-radius:14px;padding:16px 18px;box-shadow:0 12px 30px rgba(15,23,42,.08)}.history-budget h3,.history-budget h4{margin:0 0 10px;font-size:1.1rem}.history-budget h4{margin-top:16px;font-size:1rem}.budget-table{display:grid;grid-template-columns:1.4fr 1.2fr .6fr 1fr;gap:8px;margin-top:10px}.summary-table{grid-template-columns:1.4fr 1.2fr 1fr}.budget-row{display:contents}.budget-row span{padding:6px 0;font-size:.9rem}.budget-header span{font-weight:700;border-bottom:1px solid #e5e5e5}.entry-amount{font-weight:700}.empty{padding:26px;text-align:center;color:#6b7280;background:#fff;border:1px solid #e7e5f4;border-radius:16px}@media(max-width:980px){.month-layout{grid-template-columns:1fr}.month-budget{position:static}}@media(max-width:600px){.shell,.main{padding-left:12px;padding-right:12px}.navbar__container{padding:0 12px}.navbar__logo{font-size:1.35rem}.navbar__links{padding:0 .5rem;font-size:.9rem}.history-controls{align-items:flex-start;flex-direction:column}.history-filters,.history-filters input{width:100%;min-width:0}.budget-table{font-size:.82rem;grid-template-columns:1.2fr 1.1fr .45fr .8fr}.summary-table{grid-template-columns:1.1fr 1.2fr .8fr}}
</style></head><body>
<main class="shell"><nav class="workspace-tabs" aria-label="Dashboard"><a href="index.html">Trading dashboard</a><a href="income-tracker.html" aria-current="page">Income tracker</a><a href="personal-finances.html">Personal finances</a></nav></main>
<nav class="navbar" aria-label="Income tracker navigation"><div class="navbar__container"><a class="navbar__logo" href="income-tracker.html">Income Tracker</a><ul class="navbar__menu"><li><a class="navbar__links" href="income-tracker.html">Home</a></li><li><a class="navbar__links" href="income-history.html" aria-current="page">History</a></li><li><a class="navbar__links" href="income-spending.html">Spending</a></li></ul></div></nav>
<main class="main"><div class="history-shell"><section class="history-controls"><div><h1>History</h1><p class="subtext">Browse prior months (current month hidden), search by job or note.</p></div><div class="history-filters"><input id="historySearch" type="search" placeholder="Search by job, description, or date" aria-label="Search history"></div></section><section id="historyList" class="history-list" aria-live="polite"></section></div></main>
<script>
const $=id=>document.getElementById(id);let entries=[],subscriptions=[];const esc=value=>String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char])),money=value=>(Number(value)<0?'-':'')+Math.abs(Number(value)).toLocaleString('en-US',{style:'currency',currency:'USD'}),monthKey=date=>date.slice(0,7),currentMonth=()=>new Date().toISOString().slice(0,7),monthLabel=key=>new Date(key+'-01T12:00:00').toLocaleDateString('en-US',{month:'long',year:'numeric'}),round=value=>Math.round(Number(value)*100)/100;
function alloc(total,gas){if(total<=0)return{gasBonus:0,mom:0,checkings:0,hysa:0,roth:0,p:{gasBonus:0,mom:0,checkings:0,hysa:0,roth:0}};const gasBonus=Math.min(gas||91.84,total),gasPct=gasBonus/total;let pool=Math.max(total-gasBonus,0),mom=Math.min(total>=200?Math.max(pool*.11,100):pool*.11,pool),remaining=Math.max(pool-mom,0),checkings=remaining*(1.4/4.4),hysa=remaining*(2/4.4),roth=remaining*(1/4.4),max=total*.2;if(checkings>max){const excess=checkings-max;checkings=max;hysa+=excess*.6;roth+=excess*.4;}if(hysa<=roth&&hysa+roth>0){const shift=Math.min((roth-hysa)/2+.01,roth);roth-=shift;hysa+=shift;}roth+=total-(gasBonus+mom+checkings+hysa+roth);return{gasBonus,mom,checkings,hysa,roth,p:{gasBonus:gasPct,mom:mom/total,checkings:checkings/total,hysa:hysa/total,roth:roth/total}};}
function budget(records,incomeTotal,key){const gasBonus=records.filter(entry=>entry.category==='GasBonus').reduce((sum,entry)=>sum+Number(entry.amount),0),gasSpent=records.filter(entry=>entry.category==='Spent'&&entry.description.toLowerCase().includes('gas')).reduce((sum,entry)=>sum+Number(entry.amount),0),gasAvailable=gasBonus||91.84,gasDelta=gasAvailable-gasSpent,a=alloc(incomeTotal,gasBonus),monthEnd=new Date(key.slice(0,4),Number(key.slice(5))-0,0),monthly=subscriptions.filter(sub=>sub.cadence==='Monthly'&&new Date(sub.due_date+'T12:00:00')<=monthEnd).reduce((sum,sub)=>sum+Number(sub.amount),0),yearly=subscriptions.filter(sub=>sub.cadence==='Yearly').reduce((sum,sub)=>sum+Number(sub.amount),0),row=(account,category,percent,amount)=>'<div class="budget-row"><span>'+account+'</span><span>'+category+'</span><span>'+(percent===null?'-':Math.round(percent*100)+'%')+'</span><span class="entry-amount">'+money(amount)+'</span></div>',gasOverspend=gasDelta<0,gasToMom=gasDelta>0?round(gasDelta*2/3):0,netChecking=round(a.checkings+(gasDelta>0?round(gasDelta-gasToMom):0)),summaryMom=round(a.mom+gasToMom),grossHysa=round(netChecking+a.hysa),summaryIncome=round(incomeTotal-(a.gasBonus-gasDelta)),summary=(account,category,amount)=>'<div class="budget-row"><span>'+account+'</span><span>'+category+'</span><span class="entry-amount">'+money(amount)+'</span></div>';return '<aside class="history-budget"><h3>Monthly Budget</h3><div class="budget-table"><div class="budget-row budget-header"><span>Account</span><span>Category</span><span>%</span><span>Amount</span></div>'+row('Net Income','-',null,incomeTotal)+row('Gas Bonus','Gas',a.p.gasBonus,a.gasBonus)+row('Gas Remaining',gasOverspend?'Gas (overspend hits Checkings)':'Gas',null,gasDelta)+row('MOM','Mom',a.p.mom,a.mom)+row('AMEX Checkings','Spending',a.p.checkings,a.checkings)+(monthly?row('Subscriptions (Monthly)','Recurring',null,monthly):'')+row('AMEX HYSA','Savings',a.p.hysa,a.hysa)+row('RothIRA','Retirement',a.p.roth,a.roth)+(yearly?row('Yearly Subscriptions','Recurring',null,yearly):'')+'</div><h4>Summary</h4><div class="budget-table summary-table"><div class="budget-row budget-header"><span>Account</span><span>Category</span><span>Amount</span></div>'+summary('Net Income','- gas',summaryIncome)+summary('MOM','Mom',summaryMom)+summary('Net Checking','Spending budget',netChecking)+summary('Gross HYSA','Checking + HYSA',grossHysa)+summary('RothIRA','Retirement',a.roth)+'</div></aside>';}
function render(){const term=$('historySearch').value.trim().toLowerCase(),prior=entries.filter(entry=>monthKey(entry.date)!==currentMonth()&&entry.category!=='GasBonus'&&(!term||(entry.category+' '+entry.description+' '+entry.date).toLowerCase().includes(term))),groups=prior.reduce((all,entry)=>{const key=monthKey(entry.date);(all[key]||=[]).push(entry);return all;},{}),keys=Object.keys(groups).sort((a,b)=>b.localeCompare(a));if(!keys.length){$('historyList').innerHTML='<p class="empty">No past-month entries found.</p>';return;}$('historyList').innerHTML=keys.map(key=>{const records=groups[key].sort((a,b)=>b.date.localeCompare(a.date)),allMonth=entries.filter(entry=>monthKey(entry.date)===key),income=records.filter(entry=>entry.category!=='Spent').reduce((sum,entry)=>sum+Number(entry.amount),0),spent=records.filter(entry=>entry.category==='Spent'&&!entry.description.toLowerCase().includes('gas')).reduce((sum,entry)=>sum+Number(entry.amount),0),net=income-spent,cards=records.map(entry=>'<article class="history-entry"><div class="history-entry__top"><span class="badge '+(entry.category==='Spent'?'spent':'')+'">'+esc(entry.category)+'</span><span class="history-amount '+(entry.category==='Spent'?'neg':'pos')+'">'+(entry.category==='Spent'?'−':'+')+money(entry.amount)+'</span></div><p class="history-date">'+esc(entry.date)+'</p>'+(entry.description?'<p>'+esc(entry.description)+'</p>':'')+'</article>').join(''),side=Number(key.slice(0,4))>=2026?'<div class="month-budget">'+budget(allMonth,income,key)+'</div>':'';return '<details class="month-panel"><summary><div class="month-header"><div><h2>'+monthLabel(key)+'</h2><div class="pill-row"><span class="pill income-pill">Income: '+money(income)+'</span><span class="pill spent-pill">Spent: −'+money(spent)+'</span><span class="pill net-pill">Net: '+money(net)+'</span></div></div><span class="chevron">▼</span></div></summary><div class="month-layout"><div class="month-entries__grid">'+cards+'</div>'+side+'</div></details>';}).join('');}
async function load(){try{const response=await fetch('/api/income-tracker');if(!response.ok)throw Error('Unable to load local history');const data=await response.json();entries=data.entries;subscriptions=data.subscriptions;render()}catch(error){$('historyList').innerHTML='<p class="empty">'+esc(error.message)+'</p>';}}$('historySearch').addEventListener('input',render);load();
</script></body></html>
