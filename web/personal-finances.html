  <style>
    :root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172b40;background:#f5f7fa}*{box-sizing:border-box}body{margin:0}.shell{max-width:1120px;margin:auto;padding:32px 20px 64px}.top,.toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}h1{margin:0;font-size:28px}h2{margin:0;font-size:18px}.sub,.muted{margin:7px 0 0;color:#64788d;font-size:13px}.pill{font-size:12px;background:#e9eef4;border:1px solid #d9e2eb;padding:8px 12px;border-radius:20px}.workspace-tabs{display:flex;gap:4px;margin-bottom:22px;padding:5px;background:#e8edf2;border-radius:11px;width:max-content;max-width:100%;overflow:auto}.workspace-tabs a{white-space:nowrap;text-decoration:none;color:#536e86;font-size:13px;font-weight:700;padding:9px 13px;border-radius:7px}.workspace-tabs a:hover,.workspace-tabs a:focus{color:#1e5a94;outline:none}.workspace-tabs a[aria-current=page]{background:#fff;color:#1e5a94;box-shadow:0 1px 3px rgba(23,43,64,.16)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:24px 0}.card,.panel{background:#fff;border:1px solid #e0e6ed;border-radius:12px;padding:20px}.label{color:#64788d;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}.metric{margin-top:8px;font-size:27px;font-weight:760;font-variant-numeric:tabular-nums}.positive{color:#15805b}.negative{color:#c34350}.panel{margin-top:16px}.two-col{display:grid;grid-template-columns:1.05fr .95fr;gap:16px}form{display:grid;grid-template-columns:1.2fr .75fr .9fr .8fr auto;gap:10px;margin-top:16px}input,select,button{font:inherit}input,select{width:100%;border:1px solid #cdd9e5;border-radius:8px;padding:10px;color:#172b40;background:#fff}button{cursor:pointer;border:1px solid #1e5a94;border-radius:8px;padding:10px 13px;background:#1e5a94;color:#fff;font-weight:700}button:hover{background:#174a7b}.secondary{background:#fff;color:#294761;border-color:#cdd9e5}.secondary:hover{background:#f2f7fb}.budget-list{display:grid;gap:14px;margin-top:18px}.budget-row{display:grid;grid-template-columns:135px 1fr 96px;align-items:center;gap:12px}.bar{height:10px;border-radius:99px;background:#e8edf2;overflow:hidden}.bar span{display:block;height:100%;border-radius:inherit;background:#3b82b6}.bar span.over{background:#c34350}.budget-amount{text-align:right;font-size:12px;font-variant-numeric:tabular-nums;color:#536e86}table{width:100%;border-collapse:collapse;font-size:13px;margin-top:12px}th,td{text-align:left;padding:11px 8px;border-bottom:1px solid #e9edf2}th{color:#64788d;font-size:12px}.right{text-align:right}.delete{padding:5px 8px;font-size:12px;background:#fff;color:#c34350;border-color:#efc5ca}.delete:hover{background:#fff1f2}.empty{color:#64788d;font-size:13px;padding:18px 0}.month{border:1px solid #cdd9e5;border-radius:8px;padding:9px 10px;color:#294761;background:#fff}@media(max-width:760px){.cards{grid-template-columns:repeat(2,1fr)}.two-col{grid-template-columns:1fr}form{grid-template-columns:1fr 1fr}form button{grid-column:1/-1}.budget-row{grid-template-columns:100px 1fr 82px}}@media(max-width:460px){.shell{padding:20px 12px}.cards{grid-template-columns:1fr}.budget-row{grid-template-columns:88px 1fr}.budget-amount{grid-column:2}.metric{font-size:25px}}
