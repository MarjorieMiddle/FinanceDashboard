<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Income Tracker · Local Finance Dashboard</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172b40;background:#f6f6f6}*{box-sizing:border-box}body{margin:0}.shell{max-width:1120px;margin:auto;padding:20px}.workspace-tabs{display:flex;gap:4px;margin-bottom:18px;padding:5px;background:#e8edf2;border-radius:11px;width:max-content;max-width:100%;overflow:auto}.workspace-tabs a{white-space:nowrap;text-decoration:none;color:#536e86;font-size:13px;font-weight:700;padding:9px 13px;border-radius:7px}.workspace-tabs a:hover,.workspace-tabs a:focus{color:#1e5a94;outline:none}.workspace-tabs a[aria-current=page]{background:#fff;color:#1e5a94;box-shadow:0 1px 3px rgba(23,43,64,.16)}.navbar{height:80px;background:#fff;display:flex;justify-content:center;align-items:center}.navbar__container{display:flex;justify-content:space-between;align-items:center;height:100%;width:100%;max-width:1100px;padding:0 18px}.navbar__logo{color:#0e1c67;font-size:2rem;font-weight:700;text-decoration:none}.navbar__menu{display:flex;align-items:center;list-style:none;margin:0;padding:0}.navbar__links{display:flex;align-items:center;height:80px;padding:0 1rem;color:#000;text-decoration:none}.navbar__links:hover,.navbar__links:focus,.navbar__links[aria-current=page]{color:#0e1c67;outline:none}.navbar__links[aria-current=page]{font-weight:700}.max-content{max-width:1300px;margin:0 auto;padding:24px 20px 50px}.container{display:flex;min-height:calc(100vh - 120px);gap:16px}.output-section,.subscriptions-card{padding:20px 24px;background:#fff;border:1px solid #e5e7eb;border-radius:10px}.container>.output-section{flex:1;min-width:300px;max-height:calc(100vh - 120px);overflow:auto}.section-title h2,.output-section>h2{margin:0 0 6px;font-size:1.25rem}.subtext{margin:0;color:#6b7280;font-size:.93rem;line-height:1.45}label{display:block;margin:15px 0 6px;font-size:.9rem;font-weight:650}input,select,button{font:inherit}input,select{width:100%;padding:10px 12px;color:#172b40;background:#f6f6f6;border:1px solid #d1d5db;border-radius:4px}button{cursor:pointer;padding:10px 14px;color:#fff;background:#4285f4;border:0;border-radius:4px;font-weight:700}button:hover{background:#357ae8}.button-row{display:flex;gap:10px;margin-top:16px}.ghost-btn{color:#111;background:#f5f5f5;border:1px solid #d1d1d1}.ghost-btn:hover{background:#e7e7e7}.status{min-height:20px;margin:12px 0 0;color:#64788d;font-size:.86rem}.status.error{color:#b91c1c}.budget-table{display:grid;grid-template-columns:1.4fr 1.2fr .6fr 1fr;gap:8px;margin-top:10px}.summary-table{grid-template-columns:1.4fr 1.2fr 1fr}.budget-row{display:contents;font-size:.95rem}.budget-row span{padding:6px 0}.budget-row span:last-child{font-variant-numeric:tabular-nums}.budget-header span{font-weight:700;border-bottom:1px solid #e5e5e5}.summary-title{margin:20px 0 8px}.entry-list{display:grid;gap:8px;margin-top:12px;max-height:380px;overflow:auto}.entry-row{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid #e0e0e0;border-radius:8px;background:#fff}.entry-row input{width:auto;margin-top:3px}.entry-content{min-width:0;flex:1}.entry-header{display:flex;justify-content:space-between;gap:8px}.entry-content p{margin:4px 0 0;color:#6b7280;font-size:.84rem}.entry-amount{font-weight:750;font-variant-numeric:tabular-nums}.pos{color:#15803d}.neg{color:#b91c1c}.entries-actions{margin-top:12px}.subscriptions-container{max-width:1300px;margin:0 auto;padding:20px 24px 32px;background:#f6f6f6}.subscriptions-card{max-width:1100px;border:0;border-radius:0;padding:0;background:transparent}.subscription-list{display:grid;gap:8px;margin-top:16px}.subscription-row{display:flex;justify-content:space-between;gap:12px;padding:10px;background:#fff;border:1px solid #e5e7eb;border-radius:8px;font-size:.9rem}.subscription-row p{margin:3px 0 0;color:#6b7280;font-size:.82rem}.delete-subscription{padding:5px 8px;font-size:.78rem;color:#b91c1c;background:#fff;border:1px solid #efc5ca}@media(max-width:960px){.container{flex-wrap:wrap}.container>.output-section{max-height:none}}@media(max-width:600px){.shell,.max-content,.subscriptions-container{padding-left:12px;padding-right:12px}.navbar__container{padding:0 12px}.navbar__logo{font-size:1.35rem}.navbar__links{padding:0 .5rem;font-size:.9rem}.container{display:block}.container>.output-section{margin-bottom:14px;min-width:0}.budget-table{font-size:.84rem;grid-template-columns:1.25fr 1.15fr .45fr .85fr}.summary-table{grid-template-columns:1.1fr 1.2fr .85fr}}
</style></head><body>
<main class="shell"><nav class="workspace-tabs" aria-label="Dashboard"><a href="index.html">Trading dashboard</a><a href="income-tracker.html" aria-current="page">Income tracker</a><a href="personal-finances.html">Personal finances</a></nav></main>
<nav id="top" class="navbar" aria-label="Income tracker navigation"><div class="navbar__container"><a class="navbar__logo" href="income-tracker.html#top">Income Tracker</a><ul class="navbar__menu"><li><a class="navbar__links" href="income-tracker.html#top" aria-current="page">Home</a></li><li><a class="navbar__links" href="income-history.html#top">History</a></li><li><a class="navbar__links" href="income-spending.html#top">Spending</a></li></ul></div></nav>
<main class="max-content"><div class="container">
<section class="output-section"><div class="section-title"><h2>Log income or spending</h2><p class="subtext">Choose a category, add an amount, and date it.</p></div><label for="category">Category</label><select id="category"><optgroup label="Income"><option>WTDC</option><option>Gift</option><option>Trading Payout</option><option>Other</option></optgroup><optgroup label="Spending"><option>Spent</option></optgroup></select><div id="descriptionGroup" hidden><label for="description">Describe your spending</label><input id="description" type="text" maxlength="200" placeholder="What did you buy?"></div><label for="amount">Amount</label><input id="amount" type="number" step="0.01" min="0" inputmode="decimal" placeholder="e.g. 125.50"><label for="date">Date</label><input id="date" type="date"><div class="button-row"><button id="saveEntry" type="button">Save entry</button></div><p id="status" class="status" aria-live="polite"></p></section>
<section class="output-section"><h2>Monthly Budget</h2><div id="budgetOutput"></div></section>
<section id="entries" class="output-section"><h2>Entries</h2><div id="entriesOutput" class="entry-list"></div><div class="entries-actions"><button id="deleteSelected" class="ghost-btn" type="button">Delete Selected</button></div></section>
</div></main>
<section id="subscriptions" class="subscriptions-container"><div class="subscriptions-card"><div class="section-title"><h2>Subscriptions</h2><p class="subtext">Track recurring subscriptions.</p></div><label for="subscriptionCadence">Cadence</label><select id="subscriptionCadence"><option>Monthly</option><option>Yearly</option></select><label for="subscriptionAmount">Amount</label><input id="subscriptionAmount" type="number" step="0.01" min="0" inputmode="decimal" placeholder="e.g. 12.99"><label for="subscriptionDescription">Description</label><input id="subscriptionDescription" type="text" maxlength="200" placeholder="e.g. Netflix"><label for="subscriptionDueDate">Due Date</label><input id="subscriptionDueDate" type="date"><div class="button-row"><button id="saveSubscription" class="ghost-btn" type="button">Save subscription</button></div><div id="subscriptionList" class="subscription-list"></div></div></section>
<script type="module">
import {getVault} from './offline-vault.js';
const vault=await getVault();
const $=id=>document.getElementById(id),today=new Date().toISOString().slice(0,10);let entries=[],subscriptions=[];$('date').value=today;$('subscriptionDueDate').value=today;
const esc=value=>String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char])),money=value=>Number(value).toLocaleString('en-US',{style:'currency',currency:'USD'}),id=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(16).slice(2),monthKey=date=>date.slice(0,7),currentMonth=()=>new Date().toISOString().slice(0,7);
async function save(){const response=await fetch('/api/income-tracker',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({entries,subscriptions})});if(!response.ok)throw Error((await response.json()).error||'Unable to save');await vault.storeJSON('/api/income-tracker',{entries,subscriptions,can_edit:true});}
function status(message,error){$('status').textContent=message;$('status').classList.toggle('error',!!error);}
function allocations(total,gas){if(total<=0)return{gasBonus:0,mom:0,checkings:0,hysa:0,roth:0,percents:{gasBonus:0,mom:0,checkings:0,hysa:0,roth:0}};const gasBonus=Math.min(gas||91.84,total),gasBonusPercent=gasBonus/total;let pool=Math.max(total-gasBonus,0),mom=Math.min(total>=200?Math.max(pool*.11,100):pool*.11,pool),remaining=Math.max(pool-mom,0),checkings=remaining*(1.4/4.4),hysa=remaining*(2/4.4),roth=remaining*(1/4.4),maxCheckings=total*.2;if(checkings>maxCheckings){const excess=checkings-maxCheckings;checkings=maxCheckings;hysa+=excess*.6;roth+=excess*.4;}if(hysa<=roth&&hysa+roth>0){const shift=Math.min((roth-hysa)/2+.01,roth);roth-=shift;hysa+=shift;}const residual=total-(gasBonus+mom+checkings+hysa+roth);roth+=residual;return{gasBonus,mom,checkings,hysa,roth,percents:{gasBonus:gasBonusPercent,mom:mom/total,checkings:checkings/total,hysa:hysa/total,roth:roth/total}};}
function budget(){const month=currentMonth(),records=entries.filter(entry=>monthKey(entry.date)===month),income=records.filter(entry=>entry.category!=='Spent'&&entry.category!=='GasBonus'),bonuses=records.filter(entry=>entry.category==='GasBonus'),total=income.reduce((sum,entry)=>sum+Number(entry.amount),0),gasBonus=bonuses.reduce((sum,entry)=>sum+Number(entry.amount),0),gasSpent=records.filter(entry=>entry.category==='Spent'&&entry.description.toLowerCase().includes('gas')).reduce((sum,entry)=>sum+Number(entry.amount),0),alloc=allocations(total,gasBonus),gasRemaining=Math.max(gasBonus-gasSpent,0),gasOverspend=Math.max(gasSpent-gasBonus,0),monthlySubs=subscriptions.filter(subscription=>subscription.cadence==='Monthly').reduce((sum,subscription)=>sum+Number(subscription.amount),0),yearlySubs=subscriptions.filter(subscription=>subscription.cadence==='Yearly').reduce((sum,subscription)=>sum+Number(subscription.amount),0),row=(account,category,percent,amount)=>'<div class="budget-row"><span>'+account+'</span><span>'+category+'</span><span>'+(percent===null?'-':Math.round(percent*100)+'%')+'</span><span class="entry-amount">'+money(amount)+'</span></div>',netChecking=alloc.checkings-monthlySubs,grossHysa=alloc.gasBonus+monthlySubs+alloc.hysa+netChecking,summary=(account,category,amount)=>'<div class="budget-row"><span>'+account+'</span><span>'+category+'</span><span class="entry-amount">'+money(amount)+'</span></div>';$('budgetOutput').innerHTML='<div class="budget-table"><div class="budget-row budget-header"><span>Account</span><span>Category</span><span>%</span><span>Amount</span></div>'+row('Total Income','-',null,total)+row('Gas Bonus','Gas',alloc.percents.gasBonus,alloc.gasBonus)+row('Gas Remaining',gasOverspend?'Gas (overspend hits Checkings)':'Gas',null,gasOverspend?-gasOverspend:gasRemaining)+row('MOM','Mom',alloc.percents.mom,alloc.mom)+row('AMEX Checkings','Spending',alloc.percents.checkings,alloc.checkings)+row('Subscriptions (Monthly)','Recurring',null,monthlySubs)+row('AMEX HYSA','Savings',alloc.percents.hysa,alloc.hysa)+row('RothIRA','Retirement',alloc.percents.roth,alloc.roth)+(yearlySubs?row('Yearly Subscriptions','Recurring',null,yearlySubs):'')+'</div><h3 class="summary-title">Summary</h3><div class="budget-table summary-table"><div class="budget-row budget-header"><span>Account</span><span>Category</span><span>Amount</span></div>'+summary('Net Income','-',total)+summary('MOM','Mom',alloc.mom)+summary('Net Checking','Spending budget',netChecking)+summary('Gross HYSA','Gas + Subs + HYSA + Net Checking',grossHysa)+summary('RothIRA','Retirement',alloc.roth)+'</div>';}
function entryView(){const ordered=entries.filter(entry=>entry.category!=='GasBonus'&&monthKey(entry.date)===currentMonth()).sort((a,b)=>b.date.localeCompare(a.date));$('entriesOutput').innerHTML=ordered.length?ordered.map(entry=>'<label class="entry-row"><input class="entry-checkbox" type="checkbox" value="'+esc(entry.id)+'"><span class="entry-content"><span class="entry-header"><strong>'+esc(entry.category)+'</strong><span class="entry-amount '+(entry.category==='Spent'?'neg':'pos')+'">'+(entry.category==='Spent'?'−':'')+money(entry.amount)+'</span></span><p>Date: '+esc(entry.date)+(entry.description?' · '+esc(entry.description):'')+'</p></span></label>').join(''):'<p class="subtext">No entries yet.</p>';}
function subscriptionView(){$('subscriptionList').innerHTML=subscriptions.length?subscriptions.map(subscription=>'<div class="subscription-row"><div><strong>'+esc(subscription.description)+'</strong><p>'+esc(subscription.cadence)+' · due '+esc(subscription.due_date)+'</p></div><div><strong>'+money(subscription.amount)+'</strong><button class="delete-subscription" type="button" data-id="'+esc(subscription.id)+'">Delete</button></div></div>').join(''):'<p class="subtext">No subscriptions yet.</p>';document.querySelectorAll('.delete-subscription').forEach(button=>button.onclick=async()=>{const previous=subscriptions;subscriptions=subscriptions.filter(subscription=>subscription.id!==button.dataset.id);try{await save();render()}catch(error){subscriptions=previous;status(error.message,true)}});}
function render(){budget();entryView();subscriptionView();}
$('category').onchange=()=>{$('descriptionGroup').hidden=$('category').value!=='Spent';};
$('saveEntry').onclick=async()=>{const category=$('category').value,amount=Number($('amount').value),date=$('date').value,description=$('description').value.trim();if(!Number.isFinite(amount)||amount<0||!date||(category==='Spent'&&!description)){status('Add an amount and date; spending also needs a description.',true);return;}const entry={id:id(),category,description:category==='Spent'?description:'',amount,date};entries.unshift(entry);try{await save();$('amount').value='';$('description').value='';status('Entry saved.');render()}catch(error){entries=entries.filter(item=>item!==entry);status(error.message,true)}};
$('deleteSelected').onclick=async()=>{const selected=[...document.querySelectorAll('.entry-checkbox:checked')].map(input=>input.value);if(!selected.length){status('Select one or more entries to delete.',true);return;}const previous=entries;entries=entries.filter(entry=>!selected.includes(entry.id));try{await save();status('Selected entries deleted.');render()}catch(error){entries=previous;status(error.message,true)}};
$('saveSubscription').onclick=async()=>{const amount=Number($('subscriptionAmount').value),description=$('subscriptionDescription').value.trim(),due_date=$('subscriptionDueDate').value;if(!Number.isFinite(amount)||amount<0||!description||!due_date){status('Add a subscription amount, description, and due date.',true);return;}const subscription={id:id(),cadence:$('subscriptionCadence').value,description,amount,due_date};subscriptions.push(subscription);try{await save();$('subscriptionAmount').value='';$('subscriptionDescription').value='';status('Subscription saved.');render()}catch(error){subscriptions=subscriptions.filter(item=>item!==subscription);status(error.message,true)}};
async function load(){try{const {value:data,offline}=await vault.getJSON('/api/income-tracker');entries=data.entries;subscriptions=data.subscriptions;const todayDate=new Date(),month=currentMonth(),hasGasBonus=entries.some(entry=>entry.category==='GasBonus'&&monthKey(entry.date)===month);if(!offline&&data.can_edit&&todayDate.getDate()>=15&&!hasGasBonus){entries.push({id:id(),category:'GasBonus',description:'Auto-added gas bonus after tax',amount:91.84,date:todayDate.toISOString().slice(0,10)});await save();}if(offline)status('Showing encrypted offline snapshot.');render()}catch(error){status(error.message,true);render();}}load();
</script></body></html>
