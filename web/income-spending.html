<!doctype html>
<script>if('scrollRestoration'in history)history.scrollRestoration='manual';</script>
<link rel="stylesheet" href="theme.css">
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spending · Income Tracker</title><style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#f6f6f6}*{box-sizing:border-box}body{margin:0}.shell{max-width:1120px;margin:auto;padding:20px}.workspace-tabs{display:flex;gap:4px;margin-bottom:18px;padding:5px;background:#e8edf2;border-radius:11px;width:max-content;max-width:100%;overflow:auto}.workspace-tabs a{white-space:nowrap;text-decoration:none;color:#536e86;font-size:13px;font-weight:700;padding:9px 13px;border-radius:7px}.workspace-tabs a:hover,.workspace-tabs a:focus{color:#1e5a94;outline:none}.workspace-tabs a[aria-current=page]{background:#fff;color:#1e5a94;box-shadow:0 1px 3px rgba(23,43,64,.16)}.navbar{height:80px;background:#fff;display:flex;justify-content:center;align-items:center}.navbar__container{display:flex;justify-content:space-between;align-items:center;height:100%;width:100%;max-width:1100px;padding:0 18px}.navbar__logo{color:#0e1c67;font-size:2rem;font-weight:700;text-decoration:none}.navbar__menu{display:flex;list-style:none;margin:0;padding:0}.navbar__links{display:flex;align-items:center;height:80px;padding:0 1rem;color:#000;text-decoration:none}.navbar__links:hover,.navbar__links:focus,.navbar__links[aria-current=page]{color:#0e1c67;outline:none}.navbar__links[aria-current=page]{font-weight:700}.main{min-height:calc(100vh - 120px);padding:20px}.spending-shell{max-width:1100px;margin:auto;display:flex;flex-direction:column;gap:16px}.spending-controls{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}.spending-controls h1{font-size:1.6rem;margin:0 0 4px}.subtext{margin:0;color:#6b7280}.spending-filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.spending-filters select,.spending-filters input{padding:10px 12px;border:1px solid #d1d5db;border-radius:8px;background:#fff;color:#111827;font:inherit}.spending-list{display:flex;flex-direction:column;gap:12px}.spend-panel{border:1px solid #e5e7eb;border-radius:12px;background:#fff;padding:14px}.spend-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.spend-header h2{font-size:1.17rem;margin:0 0 4px}.spend-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.spend-card{background:#f9fafb;border:1px solid #e5e7eb;border-radius:10px;padding:10px}.spend-desc{font-weight:600;margin:0 0 4px}.spend-amount{color:#b91c1c;font-weight:700;margin:0 0 4px}.spend-date{color:#6b7280;font-size:.95rem;margin:0}.helper-text{margin:0;padding:22px;color:#6b7280;text-align:center;background:#fff;border:1px solid #e5e7eb;border-radius:12px}@media(max-width:800px){.spending-controls{flex-direction:column;align-items:flex-start}.spending-filters{width:100%}.spending-filters select,.spending-filters input{flex:1;min-width:140px}}@media(max-width:560px){.shell,.main{padding:12px}.navbar__container{padding:0 12px}.navbar__logo{font-size:1.35rem}.navbar__links{padding:0 .55rem;font-size:.9rem}}
</style><style>.spending-shell{max-width:1260px}.navbar{position:sticky;top:0;z-index:10;display:block;width:calc(100% - 40px);height:auto;max-width:1260px;margin:18px auto 22px;padding:7px;background:rgba(245,247,250,.94);border:1px solid var(--line);border-radius:14px;box-shadow:0 7px 20px rgba(22,47,71,.06);backdrop-filter:blur(10px)}.navbar__container{display:flex;align-items:center;gap:4px;width:100%;max-width:none;min-height:0;padding:0;overflow-x:auto}.navbar__logo{display:none}.navbar__menu{display:flex;align-items:center;gap:4px;margin:0 0 0 auto;padding:0;list-style:none}.navbar__links{display:flex;align-items:center;flex:none;height:auto;padding:9px 12px;color:#536e86;font-size:13px;font-weight:650;text-decoration:none;white-space:nowrap;border-radius:7px}.navbar__links:hover,.navbar__links:focus{color:#1e5a94;background:var(--blue-soft);outline:none}.navbar__links[aria-current=page]{position:static;color:#536e86;font-weight:650}.navbar__links[aria-current=page]::after{content:none}.top{display:flex;align-items:center;width:calc(100% - 40px);max-width:1260px;margin:24px auto 0}.top h1{margin:0;font-size:28px}@media(max-width:600px){.navbar,.top{width:calc(100% - 24px)}}</style></head><body>
<main class="shell"><nav class="workspace-tabs" aria-label="Dashboard"><a href="index.html">Trading dashboard</a><a href="income-tracker.html" aria-current="page">Income tracker</a><a href="personal-finances.html">Personal finances</a></nav>
<header id="overview" class="top"><div><h1>Income Tracker</h1></div></header><nav id="top" class="app-nav" aria-label="Income tracker navigation"><a href="income-tracker.html#top">Home</a><a href="income-history.html#top">History</a><a href="income-spending.html#top" aria-current="page">Spending</a></nav>
<div class="main"><div class="spending-shell"><section class="spending-controls"><div><h1>Spending</h1><p class="subtext">Filter by month, search by description, and see totals at a glance.</p></div><div class="spending-filters"><select id="monthFilter" aria-label="Filter spending by month"><option value="all">All months</option></select><input id="spendSearch" type="search" placeholder="Search description or date" aria-label="Search spending"></div></section><section id="spendingList" class="spending-list" aria-live="polite"></section></div></div></main>
<script type="module">
import {getVault} from './offline-vault.js';
const vault=await getVault();
const $=id=>document.getElementById(id);let spending=[];const esc=value=>String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char])),money=value=>Number(value).toLocaleString('en-US',{style:'currency',currency:'USD'}),monthLabel=key=>new Date(key+'-01T12:00:00').toLocaleDateString('en-US',{month:'long',year:'numeric'}),titleCase=text=>String(text||'Spending').split(' ').filter(Boolean).map(word=>word[0].toUpperCase()+word.slice(1)).join(' ');
function render(){const term=$('spendSearch').value.trim().toLowerCase(),groups=spending.filter(entry=>($('monthFilter').value==='all'||entry.month=== $('monthFilter').value)&&(!term||(entry.description+' '+entry.date).toLowerCase().includes(term))).reduce((all,entry)=>{(all[entry.month]||=[]).push(entry);return all;},{}),months=Object.keys(groups).sort((a,b)=>b.localeCompare(a));$('spendingList').innerHTML=months.length?months.map(month=>{const records=groups[month].sort((a,b)=>b.date.localeCompare(a.date)),sum=tag=>records.filter(entry=>entry.tag===tag).reduce((total,entry)=>total+Number(entry.amount),0),total=records.filter(entry=>!['Mom','Day Trading','Gas'].includes(entry.tag)).reduce((sum,entry)=>sum+Number(entry.amount),0),gas=sum('Gas'),mom=sum('Mom'),summary=(label,amount,kind)=>'<span class="spend-total spend-total--'+kind+'"><b>'+label+'</b><strong>'+money(amount)+'</strong></span>';return '<article class="spend-panel"><header class="spend-header"><div><h2>'+monthLabel(month)+'</h2><div class="spend-totals">'+summary('Total spent',total,'spent')+summary('Total gas',gas,'gas')+summary('Total mom',mom,'mom')+'</div></div></header><div class="spend-grid">'+records.map(entry=>'<div class="spend-card"><p class="spend-desc">'+esc(titleCase(entry.description))+(entry.tag?'<span class="entry-tag entry-tag--'+esc(entry.tag.toLowerCase().replace(/\s+/g,'-'))+'">'+esc(entry.tag)+'</span>':'')+'</p><p class="spend-amount">−'+money(entry.amount)+'</p><p class="spend-date">'+esc(entry.date)+'</p></div>').join('')+'</div></article>';}).join(''):'<p class="helper-text">No spending matches your filters.</p>';}
async function load(){try{const {value:data,offline}=await vault.getJSON('/api/income-tracker');spending=data.entries.filter(entry=>entry.category==='Spent').map(entry=>Object.assign({},entry,{month:entry.date.slice(0,7)}));[...new Set(spending.map(entry=>entry.month))].sort((a,b)=>b.localeCompare(a)).forEach(month=>$('monthFilter').insertAdjacentHTML('beforeend','<option value="'+month+'">'+monthLabel(month)+'</option>'));render();if(offline)$('spendingList').insertAdjacentHTML('afterbegin','<p class="helper-text">Showing encrypted offline snapshot.</p>')}catch(error){$('spendingList').innerHTML='<p class="helper-text">'+esc(error.message)+'</p>';}}$('monthFilter').addEventListener('change',render);$('spendSearch').addEventListener('input',render);load();
</script><script>document.querySelectorAll('.navbar__links[href$="#top"]').forEach(link=>link.addEventListener('click',event=>{if(new URL(link.href,location.href).pathname===location.pathname){event.preventDefault();const nav=document.getElementById('top'),position=nav.style.position;nav.style.position='static';const top=window.scrollY+nav.getBoundingClientRect().top;nav.style.position=position;window.scrollTo({top,behavior:'smooth'});}}));</script></body></html>
